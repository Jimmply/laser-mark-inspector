name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -v --tb=short
      - name: Smoke - generate, train, gallery
        run: |
          python scripts/generate_data.py
          python scripts/train.py
          python scripts/make_gallery.py
          python scripts/eval_combined.py
          python scripts/process_window.py
      - name: Smoke - Streamlit app renders
        run: |
          python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('src/app.py', default_timeout=120).run()
          assert not at.exception, at.exception
          print('app ok, grade', at.metric[0].value)
          "
